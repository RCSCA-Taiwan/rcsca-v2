name: Temporary annual-points test sync

on:
  push:
    branches:
      - codex/annual-points-donation-rule

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/annual-points-donation-rule
      - name: Update isolated browser expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/verify-isolated-enterprise-browser.mjs')
          s = p.read_text()
          replacements = {
            "balance!==29)throw new Error('Topic approval must add exactly two points; donation must add none')": "balance!==30)throw new Error('Topic approval must add exactly two points and a verified NT$1,000 donation must add one point')",
            "verified donation stays private and grants no unconfigured badge, points or XP": "verified donation stays private, grants one spendable point per complete NT$1,000, and grants no unconfigured badge or XP",
            "balance!==22)throw new Error('Cancellation credited before review')": "balance!==25)throw new Error('Cancellation credited before review')",
            "cancellation.balance!=='29'||cancellation.refunds!==1": "cancellation.balance!=='32'||cancellation.refunds!==1",
          }
          for old, new in replacements.items():
            if old not in s:
              raise SystemExit(f'missing expected source fragment: {old}')
            s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit deterministic assertion update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-isolated-enterprise-browser.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Align isolated browser donation point expectations"
          git push origin HEAD:codex/annual-points-donation-rule
