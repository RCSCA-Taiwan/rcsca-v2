name: Backup Operations

on:
  workflow_dispatch:
  schedule:
    # Daily at 02:30 Asia/Taipei (18:30 UTC previous day).
    - cron: "30 18 * * *"
    # Weekly restore-format drill Sunday 03:00 Asia/Taipei (19:00 UTC Saturday).
    - cron: "0 19 * * 6"

permissions:
  contents: read

concurrency:
  group: rcsca-production-backup
  cancel-in-progress: false

jobs:
  production-backup-offsite:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 18 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PGHOST: ${{ secrets.RCSCA_BACKUP_PGHOST }}
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: ${{ secrets.RCSCA_BACKUP_PGUSER }}
      PGPASSWORD: ${{ secrets.RCSCA_BACKUP_PGPASSWORD }}
      RCSCA_BACKUP_PROJECT_REF: ${{ secrets.RCSCA_BACKUP_PROJECT_REF }}
      RCSCA_BACKUP_KEY: ${{ secrets.RCSCA_BACKUP_KEY }}
      RCSCA_BACKUP_STORAGE_KEY: ${{ secrets.RCSCA_BACKUP_STORAGE_KEY }}
      RCSCA_BACKUP_S3_BUCKET: ${{ secrets.RCSCA_BACKUP_S3_BUCKET }}
      RCSCA_BACKUP_S3_ENDPOINT: ${{ secrets.RCSCA_BACKUP_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.RCSCA_BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.RCSCA_BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.RCSCA_BACKUP_S3_REGION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify required secrets are configured
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for key in PGHOST PGUSER PGPASSWORD RCSCA_BACKUP_PROJECT_REF RCSCA_BACKUP_KEY RCSCA_BACKUP_S3_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION; do
            if [ -z "${!key:-}" ]; then missing+=("$key"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            {
              echo "## Production backup NOT READY"
              echo
              echo "Missing required protected settings:"
              for key in "${missing[@]}"; do echo "- \`$key\`"; done
              echo
              echo "No production backup was created and no offsite copy was claimed."
            } >> "$GITHUB_STEP_SUMMARY"
            printf 'Required protected backup settings are missing; no backup was taken.\n' >&2
            exit 1
          fi

      - name: Install PostgreSQL client and AWS CLI
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client awscli

      - run: npm ci

      - name: Create and locally verify encrypted Production backup
        shell: bash
        env:
          RCSCA_BACKUP_DIRECTORY: ${{ runner.temp }}/rcsca-backup
        run: |
          set -euo pipefail
          mkdir -p "$RCSCA_BACKUP_DIRECTORY"
          chmod 700 "$RCSCA_BACKUP_DIRECTORY"
          npm run backup:create | tee "$RUNNER_TEMP/backup-create.json"
          run_dir=$(find "$RCSCA_BACKUP_DIRECTORY" -mindepth 1 -maxdepth 1 -type d -name 'rcsca-*' -print -quit)
          if [ -z "$run_dir" ]; then
            echo 'Backup tool did not produce a completed run directory.' >&2
            exit 1
          fi
          test -f "$run_dir/COMPLETE.json"
          printf '%s' "$run_dir" > "$RUNNER_TEMP/backup-run-dir"

      - name: Upload encrypted bundle to independent S3-compatible storage
        shell: bash
        run: |
          set -euo pipefail
          run_dir=$(cat "$RUNNER_TEMP/backup-run-dir")
          run_name=$(basename "$run_dir")
          prefix="production/$RCSCA_BACKUP_PROJECT_REF/$run_name"
          endpoint=()
          if [ -n "${RCSCA_BACKUP_S3_ENDPOINT:-}" ]; then endpoint=(--endpoint-url "$RCSCA_BACKUP_S3_ENDPOINT"); fi
          aws "${endpoint[@]}" s3 cp "$run_dir" "s3://$RCSCA_BACKUP_S3_BUCKET/$prefix/" --recursive --only-show-errors
          printf '%s' "$prefix" > "$RUNNER_TEMP/offsite-prefix"

      - name: Re-download offsite copy and verify authenticated bundle
        shell: bash
        run: |
          set -euo pipefail
          prefix=$(cat "$RUNNER_TEMP/offsite-prefix")
          verify_dir="$RUNNER_TEMP/offsite-verify"
          mkdir -p "$verify_dir"
          chmod 700 "$verify_dir"
          endpoint=()
          if [ -n "${RCSCA_BACKUP_S3_ENDPOINT:-}" ]; then endpoint=(--endpoint-url "$RCSCA_BACKUP_S3_ENDPOINT"); fi
          aws "${endpoint[@]}" s3 cp "s3://$RCSCA_BACKUP_S3_BUCKET/$prefix/" "$verify_dir/" --recursive --only-show-errors
          npm run backup:verify -- "$verify_dir"
          {
            echo "## Production backup verified"
            echo
            echo "- Encrypted Production export: complete"
            echo "- Independent offsite upload: complete"
            echo "- Offsite re-download: complete"
            echo "- GCM / SHA-256 / manifest verification: complete"
            echo "- Production restore: not performed"
            echo "- Inbox, provider secrets and platform settings are outside this backup scope"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove local backup material
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/rcsca-backup" "$RUNNER_TEMP/offsite-verify" "$RUNNER_TEMP/backup-run-dir" "$RUNNER_TEMP/offsite-prefix" "$RUNNER_TEMP/backup-create.json"

  isolated-restore-drill:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 19 * * 6'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:backup-tools
      - name: Run isolated synthetic restore drill
        run: npm run verify:backup-restore
      - name: Record scope
        shell: bash
        run: |
          {
            echo "## Weekly restore-format drill passed"
            echo
            echo "This validates encrypted archive restore mechanics in an isolated Docker database."
            echo "It does not claim that a hosted Production backup was restored into Supabase."
          } >> "$GITHUB_STEP_SUMMARY"
