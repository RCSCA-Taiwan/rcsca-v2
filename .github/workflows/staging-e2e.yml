name: Application and Database Verification

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rcsca-verify-v1520-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remove-obsolete-diagnostics:
    # One-time removal of the pre-isolation report, whose snapshot included
    # shared login input. No checkout or repository code runs with this token.
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 15
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Remove the obsolete shared-account failure report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request DELETE \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/11953077690")
          case "$status" in
            204|404) echo "Obsolete diagnostic report removed or already absent." ;;
            *) echo "Diagnostic cleanup failed (HTTP $status)."; exit 1 ;;
          esac

  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      # Authenticated coverage runs with generated users in database-replay.
      RCSCA_E2E_EMAIL: ""
      RCSCA_E2E_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:backup-tools
      - run: npm run verify:member-import
      - run: npm run verify:network-taxonomy
      - run: npm run verify
      - name: Install browser dependencies
        timeout-minutes: 5
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          printf '%s\n' 'Acquire::Retries "1";' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/99-rcsca-ci-timeouts >/dev/null
          npx playwright install --with-deps chromium
      - run: npm run verify:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  database-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser dependencies
        timeout-minutes: 5
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          printf '%s\n' 'Acquire::Retries "1";' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/99-rcsca-ci-timeouts >/dev/null
          npx playwright install --with-deps chromium
      - run: npm run verify:canonical-replay
